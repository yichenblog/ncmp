name: Auto Score

on:
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 (北京时间 01:00)
  workflow_dispatch:  # 允许手动触发

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 防止卡死
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 升级到最新版，修复 Node 警告

    - name: Set up Python
      uses: actions/setup-python@v5  # 升级到最新版，修复 Node 警告
      with:
        python-version: '3.11'  # 固定稳定版本，避免 3.x 自动升级出错

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scoring script
      env:
        MUSIC_U: ${{ secrets.MUSIC_U }}
        CSRF: ${{ secrets.CSRF }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        WAIT_TIME_MIN: ${{ secrets.WAIT_TIME_MIN }}
        WAIT_TIME_MAX: ${{ secrets.WAIT_TIME_MAX }}
        SCORE: ${{ secrets.SCORE }}
        FULL_EXTRA_TASKS: ${{ secrets.FULL_EXTRA_TASKS }}
      run: python main.py
