name: Auto Score

on:
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 (北京时间 01:00)
  workflow_dispatch:  # 允许手动触发

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 解决 Node.js 弃用警告，强制使用 Node 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # 改用 Python 3.9，兼容性更好，避免高版本导致依赖问题
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 先安装基础依赖，再单独安装 pyncm 的兼容版本
        pip install requests>=2.25.0 pycryptodome>=3.9.0 PyNaCl>=1.4.0
        # 安装 pyncm 的最新兼容版本（如果 1.7.1 不存在，改用最新版）
        pip install pyncm

    - name: Run scoring script
      env:
        MUSIC_U: ${{ secrets.MUSIC_U }}
        CSRF: ${{ secrets.CSRF }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        WAIT_TIME_MIN: ${{ secrets.WAIT_TIME_MIN }}
        WAIT_TIME_MAX: ${{ secrets.WAIT_TIME_MAX }}
        SCORE: ${{ secrets.SCORE }}
        FULL_EXTRA_TASKS: ${{ secrets.FULL_EXTRA_TASKS }}
      run: python main.py
